services:
  - type: web
    name: fineprint
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_CONCURRENCY
        value: 5
      - key: FINEPRINT_DEMO
        value: 0
